<svg xmlns="http://www.w3.org/2000/svg" width="944" height="524" viewBox="-32 -28 944 524" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>
  svg { --bg:#f6f7f9; --surface:#ffffff; --border:#e2e5ea; --text:#16181d; --muted:#646b78; --accent:#fb7a24; --accent-ink:#ffffff; --ok:#1f9d55; --fail:#d64545; --info:#3b82f6; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0e1014; --surface:#161920; --border:#2a2f3a; --text:#e8eaee; --muted:#8b93a3; --accent:#ff8a3d; --accent-ink:#14100c; --ok:#3ccf7f; --fail:#f07171; --info:#6aa5ff; }
  }
  .t { font-size: 15px; font-weight: 600; fill: var(--text); }
  .s { font-size: 12.5px; fill: var(--muted); }
  .muted { fill: var(--muted); font-weight: 500; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .press { animation: press 11s linear infinite; transform-box: fill-box; transform-origin: center; }
  .cursor { animation: cur 11s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes k0{0%,7.2%{opacity:1}8%,100%{opacity:0}}
